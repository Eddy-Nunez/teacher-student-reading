spring.application.name=portal

# --- Persistence (H2; local file by default for durability, override DATABASE_URL for deployment) ---
spring.datasource.url=jdbc:h2:file:./data/portal;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- H2 console (dev only) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT ---
app.jwt.secret=${JWT_SECRET:scholastic-reading-portal-dev-secret-change-me-0123456789abcdef}
app.jwt.expiration-ms=86400000